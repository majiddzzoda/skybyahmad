<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <main>
        <section>
            <img src="./logo.png" alt="">
            <aside class="loginContainer">
                <h1 class="contentLog">Зарегистрирован? Войди в систему!</h1>
                <input class="emailInputLog" type="email" placeholder="Почта">
                <input class="passwordInputLog" type="password" placeholder="Пароль">
                <button class="loginButton">Войти</button>
                <button class="forgotButton">Забыли пароль?</button>
                <input disabled type="number" placeholder="Телефон" class="telInputLog">
            </aside>
        </section>
    </main>
</body>
<script src="./reglog.js"></script>

</html>
